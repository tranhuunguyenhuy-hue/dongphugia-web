name: M4 Production Admin release

# Separate, explicit release lane for the accepted Admin (static SPA + same-origin gateway + dedicated upload) on top of the
# unchanged canonical Public Worker. The Public-only lane (`v1-worker-release.yml`) is untouched and remains the rollback tool.
# Builds the exact main SHA once, verifies the packaged artifact against the Production PostgreSQL read-only role and, only for
# operation=publish, deploys it to the existing Production Worker with the Admin secrets passed atomically (--secrets-file),
# then smokes the real domain. No automatic rollback: the recorded previous version is restored by a separate explicit command.
# #505: flags come from the reviewed release/production-flags.json (no dispatch inputs, no default off); a SUCCESSFUL `quality` push on
# main auto-runs a read-only verify (never publish); publish needs a GO-PROD comment for the exact SHA posted after a verify PASS.
on:
  workflow_run:
    workflows: [quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_source_sha:
        description: Exact reviewed main SHA
        required: true
        type: string
      operation:
        description: verify = build and test the packaged artifact only; publish = also deploy to Production
        required: true
        type: choice
        options: [verify, publish]
        default: verify
      rollback_version_id:
        description: Publish only. Cloudflare version id that is active right now (the recorded Public rollback target)
        required: false
        type: string
      go_comment_url:
        description: 'Publish only. URL of the Owner comment on the release issue with the line GO-PROD <exact sha>, posted after a verify PASS'
        required: false
        type: string

permissions:
  contents: read

# Publish stays serialized with every Production Worker release; read-only verifies queue per candidate SHA instead, so an
# auto-verify can never replace a pending publish.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'publish' && 'v1-production-worker-release' || format('m4-verify-{0}', github.event.workflow_run.head_sha || inputs.approved_source_sha) }}
  cancel-in-progress: false

env:
  APP_ENV: production
  APP_BUILD_TARGET: public
  APP_ORIGIN: https://www.dongphugia.vn
  BUILD_SOURCE_SHA: ${{ github.sha }}
  WRANGLER_SEND_METRICS: 'false'
  PUBLIC_CATALOGUE_SOURCE: postgresql
  # Production media target for uploads (names only; the storage key is a Worker secret). Overridable by repository variables.
  M4_MEDIA_ZONE: ${{ vars.M4_PRODUCTION_MEDIA_ZONE_NAME || 'dpg-products' }}
  M4_MEDIA_STORAGE_HOST: ${{ vars.M4_PRODUCTION_MEDIA_STORAGE_HOST || 'sg.storage.bunnycdn.com' }}

jobs:
  gate:
    name: Trigger gate (no secrets)
    # Untrusted workflow_run sources (PR runs, forks, failed quality) never start a job; the script re-checks everything.
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      sha: ${{ steps.gate.outputs.sha }}
      mode: ${{ steps.gate.outputs.mode }}
      operation: ${{ steps.gate.outputs.operation }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.approved_source_sha }}
          INPUT_OPERATION: ${{ inputs.operation }}
          WR_PATH: ${{ github.event.workflow_run.path }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: node scripts/release/trigger-gate.mjs m4

  release:
    name: Build, verify and optionally publish the Production Admin Worker
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' &&
      github.repository == 'tranhuunguyenhuy-hue/dongphugia-web' && github.ref == 'refs/heads/main' &&
      github.actor == 'tranhuunguyenhuy-hue' && needs.gate.outputs.sha == github.sha
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      issues: read
    env:
      CANDIDATE_SHA: ${{ needs.gate.outputs.sha }}
      OPERATION: ${{ needs.gate.outputs.operation }}
      MODE: ${{ needs.gate.outputs.mode }}
      # Publish is reachable only from a manual dispatch; the auto path is verify-only by construction (gate + this expression).
      PUBLISH: ${{ needs.gate.outputs.operation == 'publish' && github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify protected main, exact SHA and publish prerequisites
        shell: bash
        env:
          ROLLBACK_VERSION_ID: ${{ inputs.rollback_version_id }}
          GO_COMMENT_URL: ${{ inputs.go_comment_url }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          if [ "$OPERATION" = 'publish' ]; then
            [ "$PUBLISH" = 'true' ] || { echo 'M4_RELEASE status=FAIL reason=publish_only_by_manual_dispatch'; exit 1; }
            [[ "$ROLLBACK_VERSION_ID" =~ ^[a-f0-9-]{36}$ ]] || { echo 'M4_RELEASE status=FAIL reason=rollback_version_id_required'; exit 1; }
            [[ "$GO_COMMENT_URL" =~ ^https://github\.com/tranhuunguyenhuy-hue/dongphugia-web/issues/[0-9]+#issuecomment-[0-9]+$ ]] || { echo 'M4_RELEASE status=FAIL reason=go_comment_url_required'; exit 1; }
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/public/package-lock.json
      # Cheap, dependency-free gates first: a wrong flag file, unknown live state, stale rollback target or missing GO fails in seconds.
      - name: Load the reviewed Production flags (release/production-flags.json, strict, no defaults)
        id: flags
        run: node scripts/release/flags.mjs load release/production-flags.json
      - name: Compute release scope and risk lane floor (live Production SHA to candidate)
        id: scope
        run: node scripts/release/risk-lane.mjs scope "$CANDIDATE_SHA"
      - name: Read the active Production version and compare live flags (read-only)
        id: active
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECT_ROLLBACK_VERSION: ${{ env.PUBLISH == 'true' && inputs.rollback_version_id || '' }}
        run: node scripts/release/flags.mjs active release/production-flags.json
      - name: Require GO-PROD evidence for the exact candidate (publish only)
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GO_COMMENT_URL: ${{ inputs.go_comment_url }}
          RISK_LANE: ${{ steps.scope.outputs.risk_lane }}
          FLAGS_CHANGE: ${{ steps.active.outputs.flags_change }}
          GO_PHASE: before build
        run: node scripts/release/go-evidence.mjs
      - name: Install locked toolchains
        run: |
          npm ci
          npm ci --prefix apps/public
          if [ -f apps/admin-spa/package-lock.json ]; then npm ci --prefix apps/admin-spa; fi
      - name: Run the M4 unit and contract tests
        run: env -u APP_ENV -u APP_BUILD_TARGET -u APP_ORIGIN -u PUBLIC_CATALOGUE_SOURCE npx vitest run scripts/m4 apps/public/m3-admin-gateway.test.mjs apps/public/m3-combined-dispatch.test.mjs supabase/functions/admin-api/production-migration.test.ts
      - name: Build the actual Public Worker and assemble the Public release
        shell: bash
        env:
          V1_PUBLIC_HYPERDRIVE_ID: ${{ vars.V1_PUBLIC_HYPERDRIVE_ID }}
          V1_PUBLIC_COMMERCE_HYPERDRIVE_ID: ${{ vars.V1_PUBLIC_COMMERCE_HYPERDRIVE_ID }}
          CANONICAL_PRICING: ${{ steps.flags.outputs.canonical_pricing }}
          CANONICAL_BRANDS: ${{ steps.flags.outputs.canonical_brands }}
          COMMERCE: ${{ steps.flags.outputs.commerce }}
        run: |
          set -euo pipefail
          test "$V1_PUBLIC_HYPERDRIVE_ID" = '905f5791e9d84cf285f7533b92d03f49'
          cp apps/public/wrangler.production.jsonc apps/public/wrangler.jsonc
          node scripts/app-foundation/configure-v1-m1-worker-source.mjs apps/public/wrangler.jsonc "$PUBLIC_CATALOGUE_SOURCE" "$V1_PUBLIC_HYPERDRIVE_ID"
          # #470/#505: the pricing flag is part of the reviewed artifact, read from release/production-flags.json; never edited on the Worker.
          node scripts/m4/configure-canonical-pricing.mjs apps/public/wrangler.jsonc "$CANONICAL_PRICING" "$CANONICAL_BRANDS"
          # #470/#505 commerce v1: flag + separate intake Hyperdrive binding are part of the reviewed artifact (flags file).
          node scripts/m4/configure-commerce.mjs apps/public/wrangler.jsonc "$COMMERCE" "$V1_PUBLIC_COMMERCE_HYPERDRIVE_ID" "$V1_PUBLIC_HYPERDRIVE_ID"
          npm run build:public-worker
          npm run app:assemble-public-worker -- --repository-root . --server-dir apps/public/dist/server --assets-dir apps/public/dist/client --output "$RUNNER_TEMP/v1-release" --source-sha "$GITHUB_SHA"
      - name: Add the Admin (SPA, dispatch, upload, Images binding) to the release
        run: |
          set -euo pipefail
          npx tsx scripts/m4/build-production-admin-worker.mts --release-dir "$RUNNER_TEMP/v1-release" --source-sha "$GITHUB_SHA" --media-zone "$M4_MEDIA_ZONE" --media-storage-host "$M4_MEDIA_STORAGE_HOST"
      - name: Confirm exact target, bindings and Wrangler dry-run
        shell: bash
        env:
          V1_PUBLIC_HYPERDRIVE_ID: ${{ vars.V1_PUBLIC_HYPERDRIVE_ID }}
          CANONICAL_PRICING: ${{ steps.flags.outputs.canonical_pricing }}
          CANONICAL_BRANDS: ${{ steps.flags.outputs.canonical_brands }}
          COMMERCE: ${{ steps.flags.outputs.commerce }}
          V1_PUBLIC_COMMERCE_HYPERDRIVE_ID: ${{ vars.V1_PUBLIC_COMMERCE_HYPERDRIVE_ID }}
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/v1-release/wrangler.json" <<'NODE'
          const x = JSON.parse(require('fs').readFileSync(process.argv[2], 'utf8'));
          const fail = (m) => { console.error(`M4_IDENTITY_FAIL:${m}`); process.exit(1) };
          if (x.name !== 'dongphugia-v1-public-production') fail('name');
          if (x.main !== 'worker/m4-entry.mjs') fail('main');
          const v = x.vars ?? {};
          if (v.APP_ENV !== 'production' || v.APP_BUILD_TARGET !== 'public' || v.APP_ORIGIN !== 'https://www.dongphugia.vn' || v.PREVIEW_NOINDEX === 'true') fail('vars');
          if (v.PUBLIC_CATALOGUE_SOURCE !== 'postgresql') fail('source');
          if (v.PUBLIC_SERIES_VARIANT !== undefined) fail('series-variant'); // #505: Series pilot stays off in Production
          const pricing = process.env.CANONICAL_PRICING;
          if (pricing === 'off' ? (v.PUBLIC_CANONICAL_PRICING !== undefined || v.PUBLIC_CANONICAL_PRICE_BRANDS !== undefined)
            : (pricing !== 'on' || v.PUBLIC_CANONICAL_PRICING !== 'on' || v.PUBLIC_CANONICAL_PRICE_BRANDS !== process.env.CANONICAL_BRANDS)) fail('canonical-pricing');
          if (v.ADMIN_API_URL !== 'https://bonxyxluzlxfkdetryoo.supabase.co/functions/v1/admin-api') fail('function-url');
          if (v.BUNNY_CDN_HOSTNAME !== 'dpg-products.b-cdn.net') fail('cdn');
          if (Object.keys(v).some((n) => /(SECRET|PASSWORD|TOKEN|PRIVATE_KEY|CREDENTIAL|DATABASE_URL|API_KEY|_KEY$)/i.test(n))) fail('secret-like-var');
          const commerce = process.env.COMMERCE, hd = x.hyperdrive ?? [];
          const publicDb = hd.filter((h) => h.binding === 'PUBLIC_DB'), intake = hd.filter((h) => h.binding === 'ORDER_INTAKE_DB');
          if (publicDb.length !== 1 || publicDb[0].id !== process.env.V1_PUBLIC_HYPERDRIVE_ID) fail('hyperdrive');
          if (commerce === 'off' ? (v.PUBLIC_COMMERCE !== undefined || intake.length !== 0 || hd.length !== 1)
            : (commerce !== 'on' || v.PUBLIC_COMMERCE !== 'on' || hd.length !== 2 || intake.length !== 1 || intake[0].id !== process.env.V1_PUBLIC_COMMERCE_HYPERDRIVE_ID || intake[0].id === publicDb[0].id)) fail('commerce');
          if (x.images?.binding !== 'IMAGES') fail('images');
          if (x.preview_urls !== true) fail('preview_urls');
          console.log('M4_WORKER_IDENTITY_PASS');
          NODE
          cd "$RUNNER_TEMP/v1-release"
          node "$GITHUB_WORKSPACE/apps/public/node_modules/wrangler/bin/wrangler.js" deploy --dry-run --config wrangler.json
      - name: Verify the packaged Worker (Public parity from PostgreSQL, Admin fail-closed without secrets)
        id: packaged
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = 'd54f3402b9d112ab64d6135e0e3f1fb1'
          diag="$RUNNER_TEMP/m4-packaged"; mkdir -p "$diag"
          node - "$RUNNER_TEMP/v1-release/wrangler.json" "$RUNNER_TEMP/v1-release/wrangler.packaged-smoke.json" <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          cfg.name = `dpg-m4-packaged-smoke-${process.env.GITHUB_RUN_ID}`;
          cfg.workers_dev = false; cfg.preview_urls = false;
          cfg.vars = { ...cfg.vars, PUBLIC_DB_DIAGNOSTICS: 'true' };
          delete cfg.images; // remote dev has no Images transform to exercise; the real config was dry-run above
          fs.writeFileSync(process.argv[3], JSON.stringify(cfg, null, 2) + '\n', { mode: 0o600 });
          NODE
          WRANGLER_LOG_PATH="$diag/wrangler-internal.log" node "$GITHUB_WORKSPACE/apps/public/node_modules/wrangler/bin/wrangler.js" dev \
            --remote --config "$RUNNER_TEMP/v1-release/wrangler.packaged-smoke.json" --host www.dongphugia.vn --upstream-protocol https \
            --ip 127.0.0.1 --port 8793 --show-interactive-dev-session=false > "$diag/wrangler.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in {1..90}; do
            status="$(curl --silent --noproxy '*' --output /dev/null --write-out '%{http_code}' --max-time 5 http://127.0.0.1:8793/api/health || true)"
            [ "$status" = '200' ] && { ready=1; break; }
            kill -0 "$worker_pid" 2>/dev/null || { echo 'M4_PACKAGED status=FAIL reason=worker_exited'; tail -n 20 "$diag/wrangler.log" | sed -E 's/[A-Za-z0-9_-]{32,}/***/g'; exit 1; }
            sleep 1
          done
          test "$ready" -eq 1
          node scripts/app-foundation/public-postgres-release-smoke.mjs http://127.0.0.1:8793 "$GITHUB_SHA" local
          node scripts/m4/admin-smoke.mjs http://127.0.0.1:8793 unconfigured "$GITHUB_SHA"
      - name: Verify the Production media target with a unique test object (no overwrite)
        id: media
        # #505: auto-preflight is strictly read-only, so the PUT/DELETE test object runs only for manual runs (always before a publish).
        if: needs.gate.outputs.mode == 'manual'
        continue-on-error: true
        shell: bash
        env:
          MEDIA_KEY: ${{ secrets.ADMIN_PRODUCTION_MEDIA_KEY }}
        run: |
          set -uo pipefail
          echo 'verified=false' >> "$GITHUB_OUTPUT"
          if [ -z "$MEDIA_KEY" ]; then echo 'M4_MEDIA status=FAIL reason=key_missing (uploads stay fail-closed)'; exit 1; fi
          echo "::add-mask::$MEDIA_KEY"
          cdn='dpg-products.b-cdn.net'
          path="_m4-verify/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 6).txt"
          storage="https://${M4_MEDIA_STORAGE_HOST}/${M4_MEDIA_ZONE}/${path}"
          authed() { curl -sS -m 30 -K <(printf 'header = "AccessKey: %s"\n' "$MEDIA_KEY") "$@"; }
          cleanup() { authed -o /dev/null -X DELETE "$storage" || true; }
          pre="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "https://${cdn}/${path}" || true)"
          [ "$pre" = '404' ] || { echo "M4_MEDIA status=FAIL reason=test_path_not_free status=$pre"; exit 1; }
          put="$(authed -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: text/plain' --data-binary "m4-verify-${GITHUB_RUN_ID}" "$storage" || true)"
          trap cleanup EXIT
          [ "$put" = '201' ] || { echo "M4_MEDIA status=FAIL reason=write_rejected status=$put"; exit 1; }
          ok=0
          for _ in 1 2 3 4 5; do
            got="$(curl -sS -m 20 "https://${cdn}/${path}" || true)"
            [ "$got" = "m4-verify-${GITHUB_RUN_ID}" ] && { ok=1; break; }
            sleep 3
          done
          [ "$ok" -eq 1 ] || { echo 'M4_MEDIA status=FAIL reason=public_delivery_failed'; exit 1; }
          echo "M4_MEDIA status=PASS zone=${M4_MEDIA_ZONE} write=201 public_delivery=200 host=${cdn} (test object removed)"
          echo 'verified=true' >> "$GITHUB_OUTPUT"
      - name: Verify the active version equals the recorded rollback target before publishing
        id: rollback
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_VERSION: ${{ inputs.rollback_version_id }}
        run: |
          set -euo pipefail
          wrangler="$GITHUB_WORKSPACE/apps/public/node_modules/wrangler/bin/wrangler.js"
          node "$wrangler" deployments list --name dongphugia-v1-public-production --json > "$RUNNER_TEMP/m4-before.json"
          node - "$RUNNER_TEMP/m4-before.json" <<'NODE'
          const fs = require('fs');
          const doc = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const list = Array.isArray(doc) ? doc : (doc.deployments ?? doc.result?.deployments);
          const current = list?.reduce((latest, item) => !latest || item.created_on > latest.created_on ? item : latest, null);
          const active = current?.versions?.filter((v) => v.percentage === 100) ?? [];
          if (active.length !== 1 || active[0].version_id !== process.env.EXPECTED_VERSION) { console.error('M4_ROLLBACK_TARGET_MISMATCH'); process.exit(1); }
          console.log(`M4_ROLLBACK_TARGET version=${active[0].version_id}`);
          NODE
          curl --fail --silent --show-error --max-time 20 https://www.dongphugia.vn/api/health -o "$RUNNER_TEMP/m4-health-before.json"
          echo "version_id=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
      - name: Recheck main HEAD and the GO-PROD evidence right before publishing
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GO_COMMENT_URL: ${{ inputs.go_comment_url }}
          RISK_LANE: ${{ steps.scope.outputs.risk_lane }}
          FLAGS_CHANGE: ${{ steps.active.outputs.flags_change }}
          GO_PHASE: right before publish
          CHECK_MAIN_HEAD: 'true'
        run: node scripts/release/go-evidence.mjs
      - name: Publish with the Admin secrets passed atomically
        id: deploy
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_API_HMAC_SECRET: ${{ secrets.ADMIN_API_HMAC_SECRET }}
          ADMIN_PRODUCTION_MEDIA_KEY: ${{ steps.media.outputs.verified == 'true' && secrets.ADMIN_PRODUCTION_MEDIA_KEY || '' }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = 'd54f3402b9d112ab64d6135e0e3f1fb1'
          test "${#ADMIN_API_HMAC_SECRET}" -ge 32 || { echo 'M4_RELEASE status=FAIL reason=hmac_missing_or_short'; exit 1; }
          echo "::add-mask::$ADMIN_API_HMAC_SECRET"
          [ -z "$ADMIN_PRODUCTION_MEDIA_KEY" ] || echo "::add-mask::$ADMIN_PRODUCTION_MEDIA_KEY"
          umask 077
          node -e "const s={ADMIN_API_HMAC_SECRET:process.env.ADMIN_API_HMAC_SECRET};if(process.env.ADMIN_PRODUCTION_MEDIA_KEY)s.ADMIN_PRODUCTION_MEDIA_KEY=process.env.ADMIN_PRODUCTION_MEDIA_KEY;require('fs').writeFileSync(process.argv[1],JSON.stringify(s),{mode:0o600})" "$RUNNER_TEMP/m4-secrets.json"
          echo "M4_RELEASE media_key_present=$([ -n "$ADMIN_PRODUCTION_MEDIA_KEY" ] && echo true || echo false)"
          cd "$RUNNER_TEMP/v1-release"
          node "$GITHUB_WORKSPACE/apps/public/node_modules/wrangler/bin/wrangler.js" deploy --config wrangler.json --secrets-file "$RUNNER_TEMP/m4-secrets.json" --message "M4 Admin release ${GITHUB_SHA:0:12}"
          shred -u "$RUNNER_TEMP/m4-secrets.json" 2>/dev/null || rm -f "$RUNNER_TEMP/m4-secrets.json"
      - name: Wait for the exact Production identity
        if: env.PUBLISH == 'true'
        run: node scripts/app-foundation/wait-public-production-identity.mjs "$GITHUB_SHA"
      - name: Smoke the real Production domain (Public parity and Admin)
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Paced (cold page cache after a version switch) with a bounded, visible identity retry for edge propagation.
          SMOKE_PACE_MS=700 SMOKE_SHA_RETRY_MS=120000 node scripts/app-foundation/public-postgres-release-smoke.mjs https://www.dongphugia.vn "$GITHUB_SHA" production
          node scripts/m4/admin-smoke.mjs https://www.dongphugia.vn configured "$GITHUB_SHA"
      - name: Verify the deployed version bindings and record rollback evidence
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          V1_PUBLIC_HYPERDRIVE_ID: ${{ vars.V1_PUBLIC_HYPERDRIVE_ID }}
          CANONICAL_PRICING: ${{ steps.flags.outputs.canonical_pricing }}
          CANONICAL_BRANDS: ${{ steps.flags.outputs.canonical_brands }}
          COMMERCE: ${{ steps.flags.outputs.commerce }}
          V1_PUBLIC_COMMERCE_HYPERDRIVE_ID: ${{ vars.V1_PUBLIC_COMMERCE_HYPERDRIVE_ID }}
        run: |
          set -euo pipefail
          wrangler="$GITHUB_WORKSPACE/apps/public/node_modules/wrangler/bin/wrangler.js"
          node "$wrangler" deployments list --name dongphugia-v1-public-production --json > "$RUNNER_TEMP/m4-after.json"
          version="$(node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));const l=Array.isArray(d)?d:(d.deployments??d.result?.deployments);const c=l.reduce((a,i)=>!a||i.created_on>a.created_on?i:a,null);const a=c.versions.filter(v=>v.percentage===100);if(a.length!==1)process.exit(1);process.stdout.write(a[0].version_id)" "$RUNNER_TEMP/m4-after.json")"
          node "$wrangler" versions view "$version" --name dongphugia-v1-public-production --json > "$RUNNER_TEMP/m4-version.json"
          node - "$RUNNER_TEMP/m4-version.json" "$V1_PUBLIC_HYPERDRIVE_ID" <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const b = (raw.version ?? raw.result ?? raw).resources?.bindings ?? [];
          const has = (name, type) => b.some((x) => x.name === name && (!type || x.type === type));
          const intake = b.filter((x) => x.name === 'ORDER_INTAKE_DB' && x.type === 'hyperdrive');
          const commerceOk = process.env.COMMERCE === 'on'
            ? intake.length === 1 && (intake[0].id ?? intake[0].hyperdrive_id) === process.env.V1_PUBLIC_COMMERCE_HYPERDRIVE_ID && b.some((x) => x.name === 'PUBLIC_COMMERCE' && x.text === 'on')
            : intake.length === 0 && !b.some((x) => x.name === 'PUBLIC_COMMERCE');
          const ok = commerceOk && b.filter((x) => x.name === 'PUBLIC_DB' && x.type === 'hyperdrive').length === 1
            && (b.find((x) => x.name === 'PUBLIC_DB').id ?? b.find((x) => x.name === 'PUBLIC_DB').hyperdrive_id) === process.argv[3]
            && has('IMAGES') && has('ADMIN_API_HMAC_SECRET', 'secret_text') && has('ASSETS')
            && b.some((x) => x.name === 'APP_ENV' && x.text === 'production') && b.some((x) => x.name === 'ADMIN_API_URL')
            && (process.env.CANONICAL_PRICING === 'on'
              ? b.some((x) => x.name === 'PUBLIC_CANONICAL_PRICING' && x.text === 'on') && b.some((x) => x.name === 'PUBLIC_CANONICAL_PRICE_BRANDS' && x.text === process.env.CANONICAL_BRANDS)
              : !b.some((x) => x.name === 'PUBLIC_CANONICAL_PRICING' || x.name === 'PUBLIC_CANONICAL_PRICE_BRANDS'));
          if (!ok) { console.error('M4_VERSION_BINDINGS_FAIL'); process.exit(1); }
          console.log(`M4_VERSION_BINDINGS_PASS names=${b.map((x) => x.name).sort().join(',')}`);
          NODE
          node scripts/release/flags.mjs check-version release/production-flags.json "$RUNNER_TEMP/m4-version.json"
          echo "DEPLOYED_WORKER_VERSION=$version" >> "$GITHUB_STEP_SUMMARY"
          echo "ROLLBACK_TARGET_VERSION=${{ steps.rollback.outputs.version_id }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Release evidence (#505, no secrets)
        if: always()
        env:
          CANONICAL_PRICING: ${{ steps.flags.outputs.canonical_pricing }}
          CANONICAL_BRANDS: ${{ steps.flags.outputs.canonical_brands }}
          COMMERCE: ${{ steps.flags.outputs.commerce }}
          SERIES_VARIANT: ${{ steps.flags.outputs.series_variant }}
          FLAGS_DIGEST: ${{ steps.flags.outputs.flags_digest }}
          PRODUCTION_SHA: ${{ steps.scope.outputs.production_sha }}
          RISK_LANE: ${{ steps.scope.outputs.risk_lane }}
          CHANGED_FILES: ${{ steps.scope.outputs.changed_files }}
          ACTIVE_VERSION: ${{ steps.active.outputs.active_version }}
          FLAGS_CHANGE: ${{ steps.active.outputs.flags_change }}
          PACKAGED: ${{ steps.packaged.outcome }}
          MEDIA: ${{ steps.media.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/release/release-evidence.mjs

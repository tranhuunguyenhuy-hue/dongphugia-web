name: One-off branch cleanup (#416)

# Deletes the reviewed stale branches listed in docs/ops/branch-cleanup-2026-11-20.txt ("<sha> <branch>" per line).
# Default is a dry run. A branch is skipped if it is main, has an open pull request, or its tip is no longer the reviewed SHA.
# Touches only branch refs: no Production, database, secrets, tags, issues or pull requests. Remove this file after use.
on:
  workflow_dispatch:
    inputs:
      approved_source_sha:
        description: Exact reviewed main SHA
        required: true
        type: string
      dry_run:
        description: true = list only; false = delete
        required: true
        type: boolean
        default: true
      confirm:
        description: Type DELETE to allow a real deletion (ignored for dry runs)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-off-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'tranhuunguyenhuy-hue/dongphugia.com.vn' && github.ref == 'refs/heads/main' &&
      github.actor == 'tranhuunguyenhuy-hue' && inputs.approved_source_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Delete reviewed branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -uo pipefail
          LIST=docs/ops/branch-cleanup-2026-11-20.txt
          KEEP='^(main|claude/exciting-archimedes-xuly38|codex/infra-01-credential-registry|codex/infra-01-m2-snapshot-role|codex/issue-343-toto-campaign|issue-343-production-evidence)$'
          if [ "$DRY_RUN" != "true" ] && [ "$CONFIRM" != "DELETE" ]; then
            echo "Real deletion requires confirm=DELETE"; exit 1
          fi
          deleted=0; would=0; skipped=0; gone=0; failed=0
          while read -r sha name; do
            [ -z "${name:-}" ] && continue
            if [[ "$name" =~ $KEEP ]]; then echo "SKIP keep-list: $name"; skipped=$((skipped+1)); continue; fi
            open=$(gh pr list --repo "$REPO" --state open --head "$name" --json number --jq 'length')
            if [ "$open" != "0" ]; then echo "SKIP open PR: $name"; skipped=$((skipped+1)); continue; fi
            if ! cur=$(gh api "repos/$REPO/git/ref/heads/$name" --jq .object.sha 2>/dev/null); then
              echo "GONE already: $name"; gone=$((gone+1)); continue
            fi
            if [ "$cur" != "$sha" ]; then echo "SKIP tip changed: $name ($cur != $sha)"; skipped=$((skipped+1)); continue; fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "WOULD DELETE: $name $sha"; would=$((would+1))
            elif gh api -X DELETE "repos/$REPO/git/refs/heads/$name" >/dev/null; then
              echo "DELETED: $name $sha"; deleted=$((deleted+1))
            else
              echo "FAILED: $name"; failed=$((failed+1))
            fi
          done < "$LIST"
          {
            echo "### Branch cleanup (#416) — dry_run=$DRY_RUN"
            echo "- would delete: $would"; echo "- deleted: $deleted"; echo "- skipped: $skipped"
            echo "- already gone: $gone"; echo "- failed: $failed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$failed" = "0" ]

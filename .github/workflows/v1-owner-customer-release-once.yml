# One-use dispatcher: Owner explicitly approved release despite flaky browser navigation
# on 2026-11-15. Runs only when THIS file is first merged with its unique
# squash-commit marker. Delete after the dispatch; never use for general releases.
name: Owner-approved one-time V1 production dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v1-owner-customer-release-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-once:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'OWNER_APPROVED_CUSTOMER_RELEASE_20261115')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch protected production workflow with emergency bypass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run v1-worker-release.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            -f publish=true \
            -f data_source=postgresql \
            -f rollback_on_failure=false \
            -f skip_navigation_acceptance=true
          echo 'ONE_TIME_OWNER_RELEASE_DISPATCHED main publish=true'

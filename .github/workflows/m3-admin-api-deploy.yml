name: 'TEST Database & Backend'
run-name: >-
  M3 TEST ${{ inputs.operation || 'deploy' }}${{ inputs.plan_id != '' && format(' [release plan={0} step={1} digest={2} env=test op={3}]',
  inputs.plan_id, inputs.operation == 'release-check' && '*' || inputs.step_id, inputs.plan_digest,
  inputs.operation == 'release-apply' && 'apply' || inputs.operation == 'release-rollback' && 'rollback' || inputs.operation == 'release-check' && 'check' || 'function') || '' }}

# Deploys supabase/functions/admin-api to the isolated TEST project uybumsnyqpwcidjxmfsv ONLY and sets its function
# secrets. Owner-dispatched on main; the Production project ref is rejected. Requires (Owner-provisioned):
#   environment `m3-test-functions` secret SUPABASE_TEST_ACCESS_TOKEN (scope: this TEST project, Edge Functions + Secrets write)
#   repository secret M3_ADMIN_API_HMAC_SECRET (32 random bytes, hex) shared with the staging Worker publisher.
# #511 TEST chain of a release plan: operation=release-* runs the reviewed plan's SQL steps on the TEST project ONLY (identity checked
# against dpg_control.target_contract) with a TEST operator credential M3_TEST_SQL_DATABASE_URL in this same environment (Owner-
# provisioned; without it the step fails closed). deploy + plan_id deploys the plan's function step after its TEST dependencies.
# Every TEST write (SQL or function) respects the fixed Staging UAT lock and shares the Staging concurrency group.
on:
  workflow_dispatch:
    inputs:
      approved_source_sha:
        description: Exact reviewed main SHA
        required: true
        type: string
      operation:
        description: deploy = the admin-api function (default, unchanged); release-* = a reviewed plan's SQL steps on TEST (#511)
        required: false
        type: choice
        options: [deploy, release-check, release-apply, release-rollback]
        default: deploy
      plan_id:
        description: '#511 release plan id (deploy: the plan whose function step this is; release-*: required)'
        required: false
        type: string
        default: ''
      step_id:
        description: '#511 plan step id (deploy with plan: the function step; release-apply/rollback: the SQL step)'
        required: false
        type: string
        default: ''
      plan_digest:
        description: '#511 64-hex plan digest'
        required: false
        type: string
        default: ''
      uat_issue:
        description: 'Issue holding the fixed Staging UAT lock for this SHA, if any (TEST writes are refused under any other lock)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  issues: read

# #511: TEST writers (SQL, function, combined Staging) are serialized together.
concurrency:
  group: m2-fixed-staging
  cancel-in-progress: false

env:
  TEST_PROJECT_REF: uybumsnyqpwcidjxmfsv
  PRODUCTION_PROJECT_REF: bonxyxluzlxfkdetryoo
  STAGING_ORIGIN: https://staging-dongphugia-v1-public-production.tranhuunguyenhuy.workers.dev
  MEDIA_HOSTS: dpg-media-staging.b-cdn.net

jobs:
  deploy:
    if: >-
      github.repository == 'tranhuunguyenhuy-hue/dongphugia-web' && github.ref == 'refs/heads/main' &&
      github.actor == 'tranhuunguyenhuy-hue' && inputs.approved_source_sha == github.sha && (inputs.operation || 'deploy') == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: m3-test-functions
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: TEST write gate (UAT lock; with a plan also the plan identity and TEST dependencies)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENV: test
          CANDIDATE_SHA: ${{ github.sha }}
          PLAN_ID: ${{ inputs.plan_id }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          STEP_ID: ${{ inputs.step_id }}
          PLAN_OP: function
          UAT_ISSUE: ${{ inputs.uat_issue }}
        run: |
          set -euo pipefail
          if [ -n "$PLAN_ID" ]; then node scripts/release/plan-evidence.mjs gate; else TEST_WRITER=true MODE=manual node scripts/release/staging-lock.mjs recheck; fi
      - name: Guard target and secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
          HMAC: ${{ secrets.M3_ADMIN_API_HMAC_SECRET }}
        run: |
          set -euo pipefail
          test "$TEST_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_TEST_ACCESS_TOKEN missing'; exit 1; }
          test "${#HMAC}" -ge 32 || { echo 'M3_ADMIN_API_HMAC_SECRET missing or too short'; exit 1; }
          grep -q 'verify_jwt = false' supabase/config.toml
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Deploy function and set secrets (TEST project only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
          HMAC: ${{ secrets.M3_ADMIN_API_HMAC_SECRET }}
        run: |
          set -euo pipefail
          echo "::add-mask::$HMAC"
          supabase functions deploy admin-api --project-ref "$TEST_PROJECT_REF" --no-verify-jwt --use-api --yes
          supabase secrets set --yes --project-ref "$TEST_PROJECT_REF" \
            "ADMIN_API_HMAC_SECRET=$HMAC" "ADMIN_API_ALLOWED_ORIGIN=$STAGING_ORIGIN" "ADMIN_API_MEDIA_HOSTS=$MEDIA_HOSTS"
          supabase functions list --project-ref "$TEST_PROJECT_REF" | tee /tmp/functions.txt
          grep -q 'admin-api' /tmp/functions.txt
      - name: Verify the deployed function rejects unsigned requests (expects 401, not 404)
        run: |
          set -euo pipefail
          sleep 10
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' "https://${TEST_PROJECT_REF}.supabase.co/functions/v1/admin-api/me")
          echo "unsigned GET /me -> $code"; head -c 200 /tmp/body.txt; echo
          test "$code" = "401"
          grep -q 'INVALID_SIGNATURE' /tmp/body.txt

  release-sql:
    # #511: a reviewed plan's SQL steps on the TEST project only. No SQL, path or URL comes from an input.
    if: >-
      github.repository == 'tranhuunguyenhuy-hue/dongphugia-web' && github.ref == 'refs/heads/main' &&
      github.actor == 'tranhuunguyenhuy-hue' && inputs.approved_source_sha == github.sha && startsWith(inputs.operation, 'release-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: m3-test-functions
    env:
      DATABASE_URL: ${{ secrets.M3_TEST_SQL_DATABASE_URL }}
      RELEASE_ENV: test
      PLAN_ID: ${{ inputs.plan_id }}
      PLAN_DIGEST: ${{ inputs.plan_digest }}
      STEP_ID: ${{ inputs.operation == 'release-check' && '*' || inputs.step_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard the TEST credential and the plan identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo 'PLAN_STEP status=FAIL reason=TEST_SQL_CREDENTIAL_MISSING (Owner: add M3_TEST_SQL_DATABASE_URL to environment m3-test-functions)'; exit 1; }
          echo "::add-mask::$DATABASE_URL"
          [[ "$PLAN_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo 'PLAN_STEP status=FAIL reason=plan_digest_required'; exit 1; }
          npm ci --ignore-scripts
          node scripts/release/plan.mjs verify "$PLAN_ID" "$PLAN_DIGEST"
      - name: TEST plan gate (TEST dependencies and the UAT lock)
        if: inputs.operation != 'release-check'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          PLAN_OP: ${{ inputs.operation == 'release-rollback' && 'rollback' || 'apply' }}
          UAT_ISSUE: ${{ inputs.uat_issue }}
        run: node scripts/release/plan-evidence.mjs gate
      - name: Check the reviewed plan (read-only, TEST)
        if: inputs.operation == 'release-check'
        env:
          PLAN_MODE: check
          PLAN_OUT: ${{ runner.temp }}/plan-out
        run: node scripts/release/plan-sql.mjs
      - name: Apply the reviewed plan step (TEST)
        if: inputs.operation == 'release-apply'
        env:
          PLAN_MODE: apply
          PLAN_OUT: ${{ runner.temp }}/plan-out
        run: node scripts/release/plan-sql.mjs
      - name: Roll back the reviewed plan step (TEST)
        if: inputs.operation == 'release-rollback'
        env:
          PLAN_MODE: rollback
          PLAN_OUT: ${{ runner.temp }}/plan-out
        run: node scripts/release/plan-sql.mjs
      - name: Upload plan step evidence (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-plan-test-${{ github.run_id }}
          path: ${{ runner.temp }}/plan-out
          if-no-files-found: ignore
          retention-days: 30

name: 'Production Backup'

# Read-only logical backup of the Production Supabase project (approved scope in scripts/backup/backup-scope.json: dpg_app +
# dpg_control + dpg_commerce since DPG-42, one exported snapshot) BEFORE any M4 change, encrypted with the
# existing age recipient, plus a checksum-verified restore into a scratch PostgreSQL service container and an exact row-count
# comparison. It never writes to Production and never prints connection details. `probe` only checks that the credential
# reaches the exact Production target contract (role names are printed, nothing else).
#
# Credential (environment `runtime-backup`): secret M4_BACKUP_DATABASE_URL, a read-only login for the Production project with
# access to every table (a role that bypasses RLS, or the project owner); falls back to SUPABASE_RUNTIME_DATABASE_URL.
# The old runtime-backup.yml role `dpg_backup` does not exist in Production, so that workflow cannot run against it (archived #510).
on:
  schedule:
    - cron: '41 19 * * *' # 02:41 Vietnam time (quiet), daily encrypted backup + isolated restore rehearsal (M5: replaces the retired runtime-backup schedule)
  workflow_dispatch:
    inputs:
      operation:
        description: probe = connectivity/target check only; backup = encrypted dump + isolated restore rehearsal
        required: true
        type: choice
        options: [probe, backup]
        default: probe

permissions:
  contents: read

concurrency:
  group: m4-production-backup
  cancel-in-progress: false

env:
  OPERATION: ${{ github.event_name == 'schedule' && 'backup' || inputs.operation }}
  POSTGRES_IMAGE: postgres:17.6-bookworm@sha256:45cd22f8d32e189d245403954882f88e7a8714301fda80dab6da90f1265b25a3
  AGE_RECIPIENT: age12zqtv9r2fc4v2j0kk6v79xrvy66gxcht2uqfxvqske4lzh83uq2qtqhfmc
  PRODUCTION_PROJECT_REF: bonxyxluzlxfkdetryoo

jobs:
  backup:
    if: github.repository == 'tranhuunguyenhuy-hue/dongphugia-web' && github.ref == 'refs/heads/main' && github.actor == 'tranhuunguyenhuy-hue'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: runtime-backup
    env:
      # Least-privilege reader first (M5); the owner credential stays as the fallback until the reader is verified.
      DATABASE_URL: ${{ secrets.M4_BACKUP_READER_DATABASE_URL || secrets.M4_BACKUP_DATABASE_URL }}
    outputs:
      bundle: ${{ steps.dump.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Pull the pinned PostgreSQL client image
        run: docker pull -q "$POSTGRES_IMAGE" >/dev/null
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Probe the Production target (read-only)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo 'M4_BACKUP status=FAIL reason=credential_missing'; exit 1; }
          pg() { docker run --rm -i --network host -e DATABASE_URL "$POSTGRES_IMAGE" psql "$DATABASE_URL" -X -q -A -t -v ON_ERROR_STOP=1 "$@"; }
          if ! out="$(pg -c "select current_user || '|' || session_user || '|' || current_setting('transaction_read_only') || '|' || (select production_writes_allowed::text from dpg_control.target_contract where project_name = 'dongphugia-runtime') || '|' || (select count(*) from dpg_app.products)" 2>/tmp/probe.err)"; then
            echo "M4_BACKUP status=FAIL stage=probe"
            # Sanitised first error line: hosts, addresses and quoted values are redacted; only the error class and role names remain.
            grep -vE '^(Unable to find image|[0-9a-f]+: |docker\.io/|Digest:|Status:)' /tmp/probe.err | tail -n 3 | sed -E 's/"[^"]*(supabase|pooler)[^"]*"/"<host>"/g; s/\([0-9a-f:.]+\)/(<ip>)/g; s/postgres(ql)?:\/\/[^ ]*/<url>/g' | cut -c1-240
            exit 1
          fi
          IFS='|' read -r current session readonly writes products <<<"$out"
          echo "M4_BACKUP status=PASS stage=probe current_user=$current session_user=$session transaction_read_only=$readonly production_writes_allowed=$writes products=$products"
          # M4 opened Admin writes: the Production contract is now writes=true (M5 #311).
          test "$writes" = 'true'
          test "$products" -gt 17000
          if [ "$current" = 'dpg_backup_reader' ]; then
            test "$readonly" = 'on' || { echo 'M4_BACKUP status=FAIL reason=reader_not_read_only'; exit 1; }
            writable="$(pg -c "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname in ('dpg_app','dpg_control') and c.relkind in ('r','p') and has_table_privilege(current_user, c.oid, 'INSERT,UPDATE,DELETE,TRUNCATE')")"
            test "$writable" = 0 || { echo "M4_BACKUP status=FAIL reason=reader_has_write_privileges ($writable)"; exit 1; }
            echo 'M4_BACKUP credential=least_privilege_reader write_privileges=0'
          else
            echo "M4_BACKUP credential=owner_fallback (replace with dpg_backup_reader, see supabase/m5-production/001_backup_reader_role.sql)"
          fi
          # DPG-42: fail closed unless every dpg_* schema with tables is in the reviewed scope and the reader can read all of
          # it with no write path (table DML, sequence USAGE/UPDATE, EXECUTE on SECURITY DEFINER functions).
          REPO="$GITHUB_WORKSPACE" bash scripts/backup/m4-scope-preflight.sh
      - name: Row-count manifest, encrypted dump and checksums
        id: dump
        if: env.OPERATION == 'backup'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends age >/dev/null
          work="$RUNNER_TEMP/m4-backup"
          # Counts, content digests, schema/ACL manifest, ownership and pg_dump read ONE exported snapshot (no before/after
          # comparison needed: concurrent commits are simply not in the snapshot); plaintext is shredded after age encryption.
          WORK="$work" REPO="$GITHUB_WORKSPACE" bash scripts/backup/m4-backup-dump.sh
          echo "bundle=$work" >> "$GITHUB_OUTPUT"
      - name: Upload encrypted bundle (14 days)
        if: env.OPERATION == 'backup'
        uses: actions/upload-artifact@v4
        with:
          name: m4-production-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m4-backup/production.dump.age
            ${{ runner.temp }}/m4-backup/manifest.txt
            ${{ runner.temp }}/m4-backup/row-counts.txt
            ${{ runner.temp }}/m4-backup/objects.txt
            ${{ runner.temp }}/m4-backup/scope.json
            ${{ runner.temp }}/m4-backup/content.txt
            ${{ runner.temp }}/m4-backup/owners.txt
            ${{ runner.temp }}/m4-backup/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  restore-rehearsal:
    needs: backup
    if: github.event_name == 'schedule' || inputs.operation == 'backup'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: runtime-backup
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/download-artifact@v4
        with:
          name: m4-production-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/restore
      - name: Verify checksums, decrypt, restore into a scratch database and gate on counts, schema objects and ACLs
        shell: bash
        env:
          AGE_IDENTITY: ${{ secrets.BACKUP_AGE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends age >/dev/null
          # Scope is trusted only if it equals a reviewed version in scripts/backup/backup-scope.json; a v2 bundle is also gated on
          # content digests, ownership (SECURITY DEFINER owners) and sequence safety. Leaves the `scratch` container for the next step.
          BUNDLE="$RUNNER_TEMP/restore" REPO="$GITHUB_WORKSPACE" CONTAINER=scratch bash scripts/backup/m4-restore-rehearsal.sh
      - name: Prove the least-privilege backup role can produce a complete dump (and that BYPASSRLS is required)
        shell: bash
        run: |
          set -euo pipefail
          # 001 (as in Production) + the reviewed dpg_commerce grant (002, scratch only), executed by a non-superuser stand-in for
          # Supabase's postgres; proves a complete scope dump, no writes, no nextval/setval, no SECURITY DEFINER EXECUTE, BYPASSRLS needed.
          REPO="$GITHUB_WORKSPACE" CONTAINER=scratch bash scripts/backup/m4-reader-proof.sh
          docker rm -f scratch >/dev/null

  failure-signal:
    needs: [backup, restore-rehearsal]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: runtime-backup
    steps:
      - name: Emit a visible, sanitized failure signal
        env:
          WEBHOOK: ${{ secrets.BACKUP_FAILURE_WEBHOOK_URL }}
        run: |
          echo "::error title=Production backup failed::m4-production-backup run $GITHUB_RUN_ID failed (${{ github.event_name }}). Check the run; no data in this message."
          echo "### Production backup FAILED (run $GITHUB_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$WEBHOOK" ]; then
            curl -sS -m 15 -X POST -H 'content-type: application/json' --data "{\"text\":\"dongphugia Production backup failed: run $GITHUB_RUN_ID\"}" "$WEBHOOK" >/dev/null || echo 'webhook delivery failed'
          fi

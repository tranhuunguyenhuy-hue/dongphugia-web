name: M2 fixed Preview
# #505: a SUCCESSFUL `quality` push on main auto-publishes the combined M3 candidate to fixed Staging unless an Owner UAT lock is held
# (label `staging-uat-lock` on one open issue). Manual publish-m3 with `uat_issue` acquires that lock after a successful deploy.
on:
  workflow_run:
    workflows: [quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_source_sha:
        description: Exact reviewed main SHA
        required: true
        type: string
      operation:
        description: M2 Public capture/preflight/publication, or M3 combined Admin preparation/publication
        type: choice
        options: [verify-read-access, capture-snapshot, prepare-preview, publish, prepare-m3, publish-m3, lock-uat]
        default: verify-read-access
        required: true
      uat_issue:
        description: 'publish-m3 / lock-uat: open issue that holds the Staging UAT lock for this exact SHA (lock-uat pins the live SHA without redeploying)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: m2-fixed-staging
  cancel-in-progress: false
jobs:
  gate:
    name: Trigger gate and UAT lock (no secrets)
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      sha: ${{ steps.gate.outputs.sha }}
      mode: ${{ steps.gate.outputs.mode }}
      operation: ${{ steps.gate.outputs.operation }}
      uat_issue: ${{ steps.gate.outputs.uat_issue }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.approved_source_sha }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_UAT_ISSUE: ${{ inputs.uat_issue }}
          WR_PATH: ${{ github.event.workflow_run.path }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: node scripts/release/trigger-gate.mjs staging
  prepare:
    needs: gate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      !endsWith(inputs.operation, '-m3') && github.ref == 'refs/heads/main' && github.actor == 'tranhuunguyenhuy-hue' &&
      github.repository == 'tranhuunguyenhuy-hue/dongphugia-web' && inputs.approved_source_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: catalogue-direct-migration
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          cache: npm
      - name: Verify protected Public reader is configured
        env:
          M2_READ_CREDENTIAL_PRESENT: ${{ secrets.M2_PUBLIC_READ_DATABASE_URL != '' }}
          M2_READ_CA_PRESENT: ${{ secrets.DIRECT_TARGET_CA != '' }}
        run: |
          if [ "$M2_READ_CREDENTIAL_PRESENT" != true ]; then
            echo '{"status":"STOP","reason":"M2_PUBLIC_SELECT_SECRET_MISSING"}'
            exit 1
          fi
          if [ "$M2_READ_CA_PRESENT" != true ]; then
            echo '{"status":"STOP","reason":"M2_SELECT_CA_MISSING"}'
            exit 1
          fi
      - name: Install locked tools before scoped credentials
        run: |
          npm ci
          npm ci --prefix apps/public
      - name: Check the M2 capture toolchain
        run: npx --no-install tsc --noEmit --project scripts/app-foundation/tsconfig.m2.json
      - name: Verify existing SELECT credential and actual Production counts
        if: inputs.operation == 'verify-read-access'
        env:
          M2_PUBLIC_READ_DATABASE_URL: ${{ secrets.M2_PUBLIC_READ_DATABASE_URL }}
          DIRECT_TARGET_CA: ${{ secrets.DIRECT_TARGET_CA }}
        run: node scripts/app-foundation/verify-m2-snapshot-read-access.mjs
      - name: Capture fresh Public-only immutable snapshot
        if: inputs.operation != 'verify-read-access'
        env:
          M2_PUBLIC_READ_DATABASE_URL: ${{ secrets.M2_PUBLIC_READ_DATABASE_URL }}
          DIRECT_TARGET_CA: ${{ secrets.DIRECT_TARGET_CA }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          ulimit -c 0
          umask 077
          npx --no-install tsx scripts/app-foundation/capture-m2-public-snapshot.mts
          checkpoint="$(node -e 'process.stdout.write(require(process.env.RUNNER_TEMP+"/m2-public-snapshot/snapshot-lock.json").checkpoint)')"
          [[ "$checkpoint" =~ ^[a-f0-9]{40}$ ]]
          echo "PUBLIC_CATALOGUE_CHECKPOINT=$checkpoint" >> "$GITHUB_ENV"
      - name: Install isolated Preview publisher and browser tools
        if: inputs.operation == 'prepare-preview' || inputs.operation == 'publish'
        run: |
          npm ci --prefix tools/m2-preview
          npx playwright install --with-deps chromium webkit
      - name: Build exact source with explicit staging configuration
        if: inputs.operation == 'prepare-preview' || inputs.operation == 'publish'
        env:
          APP_ENV: staging
          APP_BUILD_TARGET: public
          APP_ORIGIN: https://staging-dongphugia-v1-public-production.tranhuunguyenhuy.workers.dev
          PREVIEW_NOINDEX: 'true'
          PUBLIC_CATALOGUE_SOURCE: snapshot
          BUILD_SOURCE_SHA: ${{ github.sha }}
        run: |
          cp apps/public/wrangler.fixed-preview.jsonc apps/public/wrangler.jsonc
          npm run build:public-worker
      - name: Assemble source-pinned fixed Preview artifact
        if: inputs.operation == 'prepare-preview' || inputs.operation == 'publish'
        id: assemble
        run: |
          npx --no-install tsx scripts/app-foundation/assemble-m2-fixed-preview.mts \
            --source-sha "$GITHUB_SHA" --snapshot-dir "$RUNNER_TEMP/m2-public-snapshot" \
            --output "$RUNNER_TEMP/m2-preview-artifact"
      - name: Preflight packaged staging with local ASSETS and full Public acceptance
        if: inputs.operation == 'prepare-preview' || inputs.operation == 'publish'
        env:
          M1_NAVIGATION_DIAGNOSTICS: ${{ runner.temp }}/m2-local-evidence/navigation.json
          M2_EVIDENCE_DIR: ${{ runner.temp }}/m2-local-evidence
        shell: bash
        run: |
          set -euo pipefail
          export M2_PUBLIC_SNAPSHOT_CHECKPOINT="$PUBLIC_CATALOGUE_CHECKPOINT"
          mkdir -p "$M2_EVIDENCE_DIR"
          node tools/m2-preview/node_modules/wrangler/bin/wrangler.js dev --local \
            --config "$RUNNER_TEMP/m2-preview-artifact/wrangler.fixed-preview.json" \
            --ip 127.0.0.1 --port 8793 --show-interactive-dev-session=false \
            > "$M2_EVIDENCE_DIR/workerd.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..60}; do
            if curl --silent --fail --max-time 5 http://127.0.0.1:8793/api/health > "$M2_EVIDENCE_DIR/health.json"; then ready=1; break; fi
            kill -0 "$worker_pid"
            sleep 1
          done
          test "$ready" -eq 1
          node scripts/app-foundation/public-navigation-acceptance.mjs http://127.0.0.1:8793 "$GITHUB_SHA"
          node scripts/app-foundation/m2-public-acceptance.mjs "$RUNNER_TEMP/m2-preview-artifact" http://127.0.0.1:8793 "$GITHUB_SHA"
          node --input-type=module - <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.RUNNER_TEMP+'/m2-preview-artifact/m2-preflight.json', JSON.stringify({
            status:'PASS',sourceSha:process.env.GITHUB_SHA,checkpoint:process.env.PUBLIC_CATALOGUE_CHECKPOINT
          })+'\n',{mode:0o600});
          NODE
      - name: Upload sanitized access evidence
        if: inputs.operation == 'verify-read-access'
        uses: actions/upload-artifact@v4
        with:
          name: m2-read-access-${{ github.sha }}
          path: ${{ runner.temp }}/m2-read-access/read-access.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload immutable Public snapshot and checksums
        if: inputs.operation == 'capture-snapshot'
        uses: actions/upload-artifact@v4
        with:
          name: m2-public-snapshot-${{ github.sha }}
          path: ${{ runner.temp }}/m2-public-snapshot
          if-no-files-found: error
          retention-days: 7
      - name: Upload isolated Preview candidate and preflight evidence
        # Preserve the isolated candidate for local reproduction if preflight
        # fails. Publication still requires prepare success and a PASS record.
        if: always() && steps.assemble.outcome == 'success' && (inputs.operation == 'prepare-preview' || inputs.operation == 'publish')
        uses: actions/upload-artifact@v4
        with:
          name: m2-fixed-preview-${{ github.sha }}
          # .vite manifests and .assetsignore are part of the recorded digests.
          # Upload only the closed candidate paths, excluding local CLI state.
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/m2-preview-artifact/worker
            ${{ runner.temp }}/m2-preview-artifact/assets
            ${{ runner.temp }}/m2-preview-artifact/wrangler.fixed-preview.json
            ${{ runner.temp }}/m2-preview-artifact/m2-artifact.json
            ${{ runner.temp }}/m2-preview-artifact/snapshot-lock.json
            ${{ runner.temp }}/m2-preview-artifact/m2-preflight.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload local runtime evidence
        if: always() && (inputs.operation == 'prepare-preview' || inputs.operation == 'publish')
        uses: actions/upload-artifact@v4
        with:
          name: m2-local-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/m2-local-evidence
          if-no-files-found: ignore
          retention-days: 7
  publish:
    # DISABLED (#505, archival #510): the legacy M2 publisher writes a Public-only artifact over the combined fixed Staging under the
    # same SHA tag. The gate refuses `operation=publish`, and the recheck below refuses again. Re-enable only by a reviewed PR.
    needs: [gate, prepare]
    if: inputs.operation == 'publish' && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      MODE: manual
      UAT_ISSUE: ${{ inputs.uat_issue }}
      LEGACY_M2: 'true'
    # Reuse the existing non-Production credential environment only. Its legacy
    # label does not select a Worker: publisher code pins the parent and staging.
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          cache: npm
      - name: Install locked tools before publication credentials
        run: |
          npm ci
          npm ci --prefix apps/public
          npm ci --prefix tools/m2-preview
          npx playwright install --with-deps chromium webkit
      - uses: actions/download-artifact@v4
        with:
          name: m2-fixed-preview-${{ github.sha }}
          path: ${{ runner.temp }}/m2-preview-artifact
      - name: Recheck newest main and the UAT lock right before deploying (legacy M2)
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/staging-lock.mjs recheck
      - name: Publish only named staging and run real hosted acceptance
        if: steps.recheck.outputs.go == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: d54f3402b9d112ab64d6135e0e3f1fb1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: npx --no-install tsx scripts/app-foundation/publish-m2-fixed-preview.mjs "$RUNNER_TEMP/m2-preview-artifact" "$GITHUB_SHA"
      - name: Upload sanitized hosted Preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-hosted-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/m2-hosted-evidence
          if-no-files-found: ignore
          retention-days: 7
  prepare-m3:
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' &&
      (needs.gate.outputs.operation == 'prepare-m3' || needs.gate.outputs.operation == 'publish-m3')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Non-secret Preview configuration (Hyperdrive IDs, media target names) lives in this existing
    # non-Production environment; no database or storage credential is available to the build.
    environment: cloudflare-staging
    steps:
      - name: Identity gate
        env:
          APPROVED_SOURCE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_ACTOR" = tranhuunguyenhuy-hue ] \
            && [ "$GITHUB_REPOSITORY" = tranhuunguyenhuy-hue/dongphugia-web ] \
            && [ "$APPROVED_SOURCE_SHA" = "$GITHUB_SHA" ]
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          cache: npm
      - name: Install locked tools
        run: |
          npm ci
          npm ci --prefix apps/public
          npm ci --prefix tools/m2-preview
      - name: Build exact-source combined Worker
        env:
          BUILD_SOURCE_SHA: ${{ github.sha }}
        run: npm run build:m3-combined-worker
      - name: Assemble source-pinned M3 artifact with TEST bindings
        env:
          # Non-secret, reviewed identifiers: dedicated TEST Hyperdrives (cache off) and the sole Production one to exclude.
          M3_TEST_PUBLIC_HYPERDRIVE_ID: 948e4215eca5477f8f2f026b27e5d165
          M3_TEST_ADMIN_HYPERDRIVE_ID: 9f81135c71ef4f74b144e544b62ca67e
          # #446 (Owner-approved): TEST-only order-intake role dpg_order_intake_login, caching disabled, origin limit 5. Not a secret.
          M3_TEST_ORDER_INTAKE_HYPERDRIVE_ID: 0f615c39a036418ca9fff2bdcd0d1486
          M3_PRODUCTION_HYPERDRIVE_IDS: 905f5791e9d84cf285f7533b92d03f49
          M3_PRODUCTION_HYPERDRIVE_INVENTORY_VERIFIED: 'true'
          M3_PREVIEW_MEDIA_ZONE_ID: ${{ vars.M3_PREVIEW_MEDIA_ZONE_ID }}
          M3_PRODUCTION_MEDIA_ZONE_ID: ${{ vars.M3_PRODUCTION_MEDIA_ZONE_ID }}
          M3_PREVIEW_MEDIA_ZONE_NAME: ${{ vars.M3_PREVIEW_MEDIA_ZONE_NAME }}
          M3_PREVIEW_MEDIA_STORAGE_HOSTNAME: ${{ vars.M3_PREVIEW_MEDIA_STORAGE_HOSTNAME }}
          M3_PREVIEW_MEDIA_CDN_HOSTNAME: ${{ vars.M3_PREVIEW_MEDIA_CDN_HOSTNAME }}
        run: node scripts/app-foundation/assemble-m3-fixed-preview.mjs --source-sha "$GITHUB_SHA" --output dist/m3-fixed-preview
      - name: Upload M3 candidate (closed paths only)
        uses: actions/upload-artifact@v4
        with:
          name: m3-fixed-preview-${{ github.sha }}
          include-hidden-files: true
          path: |
            dist/m3-fixed-preview/combined
            dist/m3-fixed-preview/wrangler.m3-fixed-preview.json
            dist/m3-fixed-preview/m3-artifact.json
            dist/m3-fixed-preview/manifest.json
          if-no-files-found: error
          retention-days: 30
  publish-m3:
    needs: [gate, prepare-m3]
    if: needs.gate.outputs.operation == 'publish-m3' && needs.prepare-m3.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cloudflare-staging
    # issues: write only to record the UAT lock on the requesting issue (label + lock line); nothing else is written.
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
    env:
      CANDIDATE_SHA: ${{ needs.gate.outputs.sha }}
      MODE: ${{ needs.gate.outputs.mode }}
      UAT_ISSUE: ${{ needs.gate.outputs.uat_issue }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          cache: npm
      - name: Cache Playwright browsers (keyed by OS/arch and lockfiles; browser binaries only, no credentials)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'tools/m2-preview/package-lock.json') }}
      - name: Install locked tools before publication credentials
        run: |
          npm ci
          npm ci --prefix apps/public
          npm ci --prefix tools/m2-preview
          npx playwright install --with-deps chromium webkit
      - uses: actions/download-artifact@v4
        with:
          name: m3-fixed-preview-${{ github.sha }}
          path: ${{ runner.temp }}/m3-preview-artifact
      - name: Recheck newest main and the UAT lock right before deploying
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/staging-lock.mjs recheck
      - name: Publish only named staging and run hosted smoke
        id: publish
        if: steps.recheck.outputs.go == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: d54f3402b9d112ab64d6135e0e3f1fb1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          M3_PREVIEW_BUNNY_STORAGE_API_KEY: ${{ secrets.M3_PREVIEW_BUNNY_STORAGE_API_KEY }}
          M3_ADMIN_API_HMAC_SECRET: ${{ secrets.M3_ADMIN_API_HMAC_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: npx --no-install tsx scripts/app-foundation/publish-m3-fixed-preview.mjs "$RUNNER_TEMP/m3-preview-artifact" "$GITHUB_SHA"
      - name: Take the Staging UAT lock for the requesting issue (manual publish with uat_issue)
        if: steps.publish.outcome == 'success' && env.MODE == 'manual' && env.UAT_ISSUE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: d54f3402b9d112ab64d6135e0e3f1fb1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/release/staging-lock.mjs acquire
      - name: Upload sanitized hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-hosted-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/m3-hosted-evidence
          if-no-files-found: ignore
          retention-days: 30
  lock-uat:
    # Pin the SHA that fixed Staging ACTUALLY serves (e.g. after an auto publish) for Owner UAT, without rebuilding or redeploying.
    # Same concurrency group as every Staging publish; refuses unless the lock is free (or already this issue + SHA), the SHA is
    # still main HEAD and the live Staging deployment carries exactly this SHA.
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.operation == 'lock-uat'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-staging
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Take the Staging UAT lock on the live Staging SHA (no redeploy)
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.sha }}
          MODE: manual
          UAT_ISSUE: ${{ needs.gate.outputs.uat_issue }}
          CLOUDFLARE_ACCOUNT_ID: d54f3402b9d112ab64d6135e0e3f1fb1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/release/staging-lock.mjs acquire
